[theme]
name        = "Flow Light"
version     = "1.0.0"
api_version = "1"
description = "A dark studio-portfolio theme — graphite ground, signal-blue accents, bold display type and full-bleed hover cards. For sites that want to read like a case-study reel."
author      = "Synaptic Signals"

[nav_locations]
primary = "Primary Navigation"
footer  = "Footer Links"

[customizer]
enabled = true

[customizer.colors.color-page-background]
label = "Page background"

[customizer.colors.color-panel-background]
label = "Panel background (cards, inputs)"

[customizer.colors.color-header-background]
label = "Header background"

[customizer.colors.color-text]
label = "Body text"

[customizer.colors.color-text-muted]
label = "Muted text"

[customizer.colors.color-primary]
label = "Primary accent (signal blue)"

[customizer.colors.color-primary-hover]
label = "Primary accent (hover)"

[customizer.colors.color-border]
label = "Border / hairline"

[customizer.options.show_sidebar]
type    = "bool"
default = true
label   = "Show right sidebar (search, account, categories, tags)"
group   = "Sidebar"

[customizer.options.sidebar_order]
type    = "order"
default = ["search", "account", "categories", "tags"]
label   = "Sidebar widget order"
group   = "Sidebar"

[customizer.options.sidebar_order.items]
search     = "Search"
account    = "Account"
categories = "Categories"
tags       = "Tags"

[customizer.options.hero_eyebrow]
type    = "text"
default = "SELECTED WORK"
label   = "Hero eyebrow label (small tag above headline)"
group   = "Header"

[customizer.options.hero_tagline]
type    = "text"
default = "A studio for ideas that hold up under scrutiny."
label   = "Tagline (shown below the hero headline)"
group   = "Header"

[customizer.options.nav_dropdown_trigger]
type    = "choice"
default = "hover"
label   = "Header submenu trigger (for menu items with sub-items)"
group   = "Header"

[customizer.options.nav_dropdown_trigger.choices]
hover = "Hover to open"
click = "Click to open"
