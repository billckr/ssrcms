name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synaptic
          POSTGRES_PASSWORD: password
          POSTGRES_DB: synaptic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-

      - name: Build workspace
        run: cargo build --workspace

      - name: Unit + doc tests (no database needed)
        run: cargo test --workspace

      # model_crud.rs's test_pool() only connects — it never runs
      # migrations itself, unlike routes.rs (whose common::test_router()
      # calls bootstrap::build(), which does). That's harmless against a
      # real dev database that's already been migrated many times over, but
      # this Postgres service container starts out completely empty every
      # run, so model_crud.rs needs the schema created explicitly first.
      - name: Run migrations
        env:
          DATABASE_URL: postgres://synaptic:password@localhost:5432/synaptic_test
        run: ./target/debug/synap migrate

      # model_crud.rs, routes.rs, and theme_e2e.rs are all #[ignore]d by
      # default (same convention as any test needing a live database) —
      # --include-ignored runs them explicitly, now that this job actually
      # provides one.
      - name: Integration tests — model_crud
        env:
          DATABASE_URL: postgres://synaptic:password@localhost:5432/synaptic_test
        run: cargo test -p synaptic-core --test model_crud -- --include-ignored --nocapture

      # --test-threads=1: every test in this file shares one mutable
      # "localhost" site (see common::ensure_test_site), and several tests
      # (enable_locale_for_test, post creation/translation) mutate rows tied
      # to that one site with no per-test isolation. That's an accepted,
      # documented race for the read-modify-write in enable_locale_for_test,
      # but it also intermittently made
      # test_locale_prefixed_url_shows_translated_content fail in CI
      # ("expected an hreflang alternate link for '<locale>'") even after
      # that specific race was fixed — not reproducible locally after dozens
      # of runs, which points at CI-specific timing (fresh empty DB racing
      # multiple concurrent site-creation attempts, Docker-networked
      # Postgres) rather than one single fixable line. Serializing this
      # binary's tests removes the whole class of shared-state races at once
      # instead of chasing each new flake individually; this file's suite is
      # small enough that this costs a few seconds, not minutes.
      - name: Integration tests — routes
        env:
          DATABASE_URL: postgres://synaptic:password@localhost:5432/synaptic_test
        run: cargo test -p synaptic-core --test routes -- --include-ignored --nocapture --test-threads=1

      - name: Integration tests — theme_e2e
        env:
          DATABASE_URL: postgres://synaptic:password@localhost:5432/synaptic_test
        run: cargo test -p synaptic-core --test theme_e2e -- --include-ignored --nocapture
