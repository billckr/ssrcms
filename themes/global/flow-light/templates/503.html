{% extends "base.html" %}

{% block title %}Unavailable — {{ site.name }}{% endblock title %}

{% block content %}
<div class="error-page">
  <p class="error-code" data-reveal style="--d:0">503</p>
  <h1 data-reveal style="--d:1">Back in a moment</h1>
  <p data-reveal style="--d:2">The page you're looking for doesn't exist.</p>
  <p class="error-path" data-reveal style="--d:2">Requested path: <code>{{ request.path }}</code></p>
  <a href="/" class="back-link" data-reveal style="--d:3">&larr; Back to home</a>
</div>
{% endblock content %}
