[theme]
name        = "Swatch Test"
version     = "1.0.0"
api_version = "1"
description = "Minimal single-page theme for testing customizer color swatches in isolation."
author      = "Synaptic Signals"

[customizer]
enabled = true

[customizer.colors.color-page-background]
label = "Page background"
group = "Colors"

[customizer.colors.color-text]
label = "Body text"
group = "Colors"

[customizer.colors.color-text-muted]
label = "Muted text"
group = "Colors"

[customizer.colors.color-primary]
label = "Primary"
group = "Colors"

[customizer.colors.color-primary-hover]
label = "Primary (hover)"
group = "Colors"

[customizer.colors.color-button-background]
label = "Button background"
group = "Buttons"

[customizer.colors.color-button-border]
label = "Button border"
group = "Buttons"

[customizer.colors.color-button-background-hover]
label = "Button background (hover)"
group = "Buttons"

[customizer.colors.color-button-text]
label = "Button text"
group = "Buttons"

[customizer.colors.color-button-text-hover]
label = "Button text (hover)"
group = "Buttons"

[customizer.options.button_style_rounded]
type    = "choice"
default = "square"
label   = "Button style"
group   = "Buttons"

[customizer.options.button_style_rounded.choices]
square  = "Square"
rounded = "Rounded"
