[theme]
name        = "Flow Light"
version     = "1.0.0"
api_version = "1"
description = "A dark studio-portfolio theme — graphite ground, signal-blue accents, bold display type and full-bleed hover cards. For sites that want to read like a case-study reel."
author      = "Synaptic Signals"

[nav_locations]
primary = "Primary Navigation"
footer  = "Footer Links"

[customizer]
enabled = true

[customizer.colors.color-page-background]
label = "Page background"

[customizer.colors.color-panel-background]
label = "Panel background (cards, inputs)"

[customizer.colors.color-header-background]
label = "Header background"

[customizer.colors.color-text]
label = "Body text"

[customizer.colors.color-text-muted]
label = "Muted text"

[customizer.colors.color-primary]
label = "Primary accent (signal blue)"

[customizer.colors.color-primary-hover]
label = "Primary accent (hover)"

[customizer.colors.color-border]
label = "Border / hairline"

[customizer.options.nav_dropdown_trigger]
type    = "choice"
default = "hover"
label   = "Header submenu trigger (for menu items with sub-items)"
group   = "Header"

[customizer.options.nav_dropdown_trigger.choices]
hover = "Hover to open"
click = "Click to open"

[customizer.options.show_search]
type    = "bool"
default = true
label   = "Show search box above the project grid"
group   = "Homepage"
