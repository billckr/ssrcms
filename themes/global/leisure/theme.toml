[theme]
name = "Leisure 101"
version = "1.0.0"
api_version = "1"
description = "A leisure site theme."
author = "Symantic Signals"

[nav_locations]
primary = "Primary Navigation"
footer  = "Footer Links"

[customizer]
enabled = true

[customizer.colors.navy]
label = "Header, footer & heading color"

[customizer.colors.blue]
label = "Primary accent (links, buttons)"

[customizer.colors.blue-dark]
label = "Primary accent (hover)"

[customizer.colors.charcoal]
label = "Body text"

[customizer.colors.muted]
label = "Muted text"

[customizer.colors.lavender]
label = "Panel background"

[customizer.colors.white]
label = "Page background"

[customizer.colors.border]
label = "Border"

[customizer.options.show_sidebar]
type    = "bool"
default = true
label   = "Show right sidebar (search, account, categories, tags)"
group   = "Side Bar"

[customizer.options.sidebar_order]
type    = "order"
default = ["search", "account", "categories", "tags"]
label   = "Sidebar widget order"
group   = "Side Bar"

[customizer.options.sidebar_order.items]
search     = "Search"
account    = "Account"
categories = "Categories"
tags       = "Tags"

[customizer.options.show_hero_subscribe]
type    = "bool"
default = false
label   = "Show Subscribe button in hero section"
group   = "Layout Options"

[customizer.options.show_hero_latest_post]
type    = "bool"
default = false
label   = "Show Read Latest Post button in hero section"
group   = "Layout Options"

[customizer.options.hero_tagline]
type    = "text"
default = ""
label   = "Tagline (shown below site name in hero)"
group   = "Layout Options"

[customizer.options.hero_background]
type            = "image"
default         = ""
default_preview = "/theme/static/images/blog-hero.jpg"
label           = "Hero background image"
group           = "Hero Image"

[customizer.options.hero_overlay]
type      = "bool"
default   = true
label     = "Darken hero image (overlay for text readability)"
group     = "Hero Image"
placement = "sidebar"

[customizer.options.show_header_search]
type    = "bool"
default = false
label   = "Show search in header"
group   = "Layout Options"

[customizer.options.show_header_signin]
type    = "bool"
default = false
label   = "Show Sign in / Sign out in header"
group   = "Layout Options"

[customizer.options.nav_dropdown_trigger]
type    = "choice"
default = "hover"
label   = "Header submenu trigger (for menu items with sub-items)"
group   = "Layout Options"

[customizer.options.nav_dropdown_trigger.choices]
hover = "Hover to open"
click = "Click to open"

[customizer.options.footer_section_order]
type    = "order"
default = ["brand", "navigation", "updates"]
label   = "Footer section order (left to right)"
group   = "Footer"

[customizer.options.footer_section_order.items]
brand      = "Site Name & Description"
navigation = "Navigation"
updates    = "Stay Updated"

[customizer.options.show_footer_updates]
type    = "bool"
default = true
label   = "Show \"Stay Updated\" section in footer"
group   = "Footer"

[customizer.options.footer_updates_order]
type    = "order"
default = ["newsletter", "rss"]
label   = "Newsletter / RSS order"
group   = "Footer"

[customizer.options.footer_updates_order.items]
newsletter = "Newsletter"
rss        = "RSS Feed"

[customizer.options.footer_copyright_align]
type    = "choice"
default = "center"
label   = "Copyright alignment"
group   = "Footer"

[customizer.options.footer_copyright_align.choices]
left   = "Left"
center = "Center"
right  = "Right"

[customizer.options.footer_copyright_text]
type    = "text"
default = ""
label   = "Custom copyright text (leave blank for © site name)"
group   = "Footer"
