name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  build-x86_64:
    name: Build x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      # Statically-linked musl binary instead of the runner's glibc, so the
      # release doesn't inherit a minimum-glibc-version requirement from
      # whatever Ubuntu image happens to build it — see the "Release
      # Pipeline" section of the Deployment & Build Toolchain admin doc
      # (and .cargo/config.toml's rustflags, needed to avoid a PIE/crt
      # mismatch segfault on first run) for the full story.
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-x86_64-musl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-x86_64-musl-

      - name: Build release binaries
        run: cargo build --release --target x86_64-unknown-linux-musl --bin synapcms --bin synap

      - name: Assemble tarball
        run: |
          VERSION="${{ github.ref_name }}"
          STAGING="synaptic-signals-${VERSION}"
          mkdir -p "${STAGING}"

          cp target/x86_64-unknown-linux-musl/release/synapcms  "${STAGING}/"
          cp target/x86_64-unknown-linux-musl/release/synap     "${STAGING}/"
          cp -r themes                    "${STAGING}/"
          cp -r plugins                   "${STAGING}/"
          mkdir -p "${STAGING}/admin"
          cp -r admin/static              "${STAGING}/admin/static"
          echo "${VERSION}" > "${STAGING}/VERSION"

          # Remove dev/test artefacts from the tarball
          rm -rf "${STAGING}/themes/sites"
          rm -rf "${STAGING}/plugins/sites"
          mkdir  "${STAGING}/themes/sites"
          mkdir  "${STAGING}/plugins/sites"

          # Strip Windows Zone.Identifier alternate-stream files
          find "${STAGING}" -name "*:Zone.Identifier" -delete

          TARBALL="synaptic-signals-${VERSION}-x86_64-linux.tar.gz"
          tar czf "${TARBALL}" "${STAGING}"
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-x86_64
          path: synaptic-signals-*.tar.gz*

  build-aarch64:
    name: Build aarch64
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-aarch64-musl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-aarch64-musl-

      # Statically-linked musl binary — see the matching comment in the
      # x86_64 job above for why.
      - name: Build release binaries (cross)
        run: cross build --release --target aarch64-unknown-linux-musl --bin synapcms --bin synap

      - name: Assemble tarball
        run: |
          VERSION="${{ github.ref_name }}"
          STAGING="synaptic-signals-${VERSION}"
          mkdir -p "${STAGING}"

          cp target/aarch64-unknown-linux-musl/release/synapcms  "${STAGING}/"
          cp target/aarch64-unknown-linux-musl/release/synap     "${STAGING}/"
          cp -r themes                    "${STAGING}/"
          cp -r plugins                   "${STAGING}/"
          mkdir -p "${STAGING}/admin"
          cp -r admin/static              "${STAGING}/admin/static"
          echo "${VERSION}" > "${STAGING}/VERSION"

          rm -rf "${STAGING}/themes/sites"
          rm -rf "${STAGING}/plugins/sites"
          mkdir  "${STAGING}/themes/sites"
          mkdir  "${STAGING}/plugins/sites"

          TARBALL="synaptic-signals-${VERSION}-aarch64-linux.tar.gz"
          tar czf "${TARBALL}" "${STAGING}"
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-aarch64
          path: synaptic-signals-*.tar.gz*

  create-release:
    name: Create GitHub Release
    needs: [build-x86_64, build-aarch64]
    if: always() && needs.build-x86_64.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Synaptic Signals ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            synaptic-signals-*.tar.gz
            synaptic-signals-*.tar.gz.sha256
